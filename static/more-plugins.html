<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/logo.png" type="image/png">
    <title>本地插件</title>
    <script>
        (function(){
            try {
                var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'dark';
                if(theme === 'dark') {
                    document.documentElement.classList.add('studio-theme-dark');
                    document.documentElement.classList.add('theme-dark');
                }
            } catch(e) {}
        })();
    </script>
    <script src="/static/js/theme.js?v=2026.09.15.1789427928"></script>
    <script src="/static/js/i18n.js?v=2026.09.15.1789422809"></script>
    <link rel="stylesheet" href="/static/css/more-apps.css?v=2026.09.15.1789422809">
    <link rel="stylesheet" href="/static/css/theme.css?v=2026.09.15.1789422809">
    <link rel="stylesheet" href="/static/css/theme-violet.css?v=2026.09.15.1789494173">
</head>
<body data-app-category="plugin">
    <div class="more-page">
        <div class="more-wrap">
            <header class="more-head">
                <div>
                    <div class="more-title" data-i18n="moreApps.plugins.title">本地插件</div>
                    <div class="more-sub" data-i18n="moreApps.plugins.subtitle">随项目附带的本地插件，复制目录后按说明安装即可使用。</div>
                </div>
                <div id="moreStatus" class="more-status"></div>
            </header>

            <main id="moreAppsGrid" class="more-grid"></main>
        </div>
    </div>

    <script src="/static/js/more-apps.js?v=2026.09.15.1789422809"></script>
</body>
</html>
